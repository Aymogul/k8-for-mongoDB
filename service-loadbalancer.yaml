# LoadBalancer example
# This Service requires a cluster or cloud provider with a LoadBalancer implementation.
# It routes traffic to Pods with the label app: public-web.
apiVersion: v1
kind: Service
metadata:
  name: public-web
  namespace: mongo-demo
  labels:
    app: public-web
spec:
  type: LoadBalancer
  selector:
    app: public-web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
