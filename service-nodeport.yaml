# NodePort example
# This Service is exposed on a node port for development or local access.
# It routes traffic to Pods with the label app: local-web.
apiVersion: v1
kind: Service
metadata:
  name: local-web
  namespace: mongo-demo
  labels:
    app: local-web
spec:
  type: NodePort
  selector:
    app: local-web
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30082
